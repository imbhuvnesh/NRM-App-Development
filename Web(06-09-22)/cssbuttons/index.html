<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>NRM Technologies for AER of India</title>
	<link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
	<header id="body1">
		<img src="ICAR-logo.gif" alt="ICAR logo" width="120" height="120" />
		<div class="top">
			<h1>Managing NRM Issues in districts of different AER regions of India</h1>
			<p class="subtitle">Explore state-wise resources, interventions, and data sources.</p>
		</div>
	</header>

	<main class="content-wrap">
		<section class="toolbar">
			<label for="stateSearch" class="sr-only">Search state</label>
			<input id="stateSearch" type="search" placeholder="Search by state name..." />
			<button id="clearSearch" class="btn2" type="button">Clear</button>
			<p id="resultCount" aria-live="polite"></p>
			<p class="state-note">Available states are directly clickable. Other states are marked as coming soon.</p>
		</section>

		<section id="stateGrid" class="state-grid">
			<button class="btn state-btn" data-state="Andaman & Nicobar Islands" data-url="">Andaman & Nicobar Islands</button>
			<button class="btn state-btn" data-state="Andhra Pradesh" data-url="">Andhra Pradesh</button>
			<button class="btn state-btn" data-state="Arunachal Pradesh" data-url="">Arunachal Pradesh</button>
			<button class="btn state-btn" data-state="Assam" data-url="../../Assam/index.html">Assam</button>
			<button class="btn state-btn" data-state="Bihar" data-url="">Bihar</button>
			<button class="btn state-btn" data-state="Chhattisgarh" data-url="">Chhattisgarh</button>
			<button class="btn state-btn" data-state="Delhi" data-url="">Delhi</button>
			<button class="btn state-btn" data-state="Goa" data-url="">Goa</button>
			<button class="btn state-btn" data-state="Gujarat" data-url="">Gujarat</button>
			<button class="btn state-btn" data-state="Haryana" data-url="">Haryana</button>
			<button class="btn state-btn" data-state="Himachal Pradesh" data-url="">Himachal Pradesh</button>
			<button class="btn state-btn" data-state="Jammu & Kashmir" data-url="">Jammu & Kashmir</button>
			<button class="btn state-btn" data-state="Jharkhand" data-url="">Jharkhand</button>
			<button class="btn state-btn" data-state="Karnataka" data-url="">Karnataka</button>
			<button class="btn state-btn" data-state="Kerala" data-url="">Kerala</button>
			<button class="btn state-btn" data-state="Madhya Pradesh" data-url="">Madhya Pradesh</button>
			<button class="btn state-btn" data-state="Maharashtra" data-url="">Maharashtra</button>
			<button class="btn state-btn" data-state="Manipur" data-url="">Manipur</button>
			<button class="btn state-btn" data-state="Meghalaya" data-url="">Meghalaya</button>
			<button class="btn state-btn" data-state="Mizoram" data-url="">Mizoram</button>
			<button class="btn state-btn" data-state="Nagaland" data-url="">Nagaland</button>
			<button class="btn state-btn" data-state="Odisha (Orissa)" data-url="">Odisha (Orissa)</button>
			<button class="btn state-btn" data-state="Punjab" data-url="">Punjab</button>
			<button class="btn state-btn" data-state="Rajasthan" data-url="Rajasthan.html.html">Rajasthan</button>
			<button class="btn state-btn" data-state="Sikkim" data-url="">Sikkim</button>
			<button class="btn state-btn" data-state="Tamil Nadu" data-url="">Tamil Nadu</button>
			<button class="btn state-btn" data-state="Tripura" data-url="">Tripura</button>
			<button class="btn state-btn" data-state="Uttar Pradesh" data-url="">Uttar Pradesh</button>
			<button class="btn state-btn" data-state="Uttarakhand" data-url="">Uttarakhand</button>
			<button class="btn state-btn" data-state="West Bengal" data-url="">West Bengal</button>
		</section>
	</main>

	<script>
		(function () {
			const searchInput = document.getElementById("stateSearch");
			const clearButton = document.getElementById("clearSearch");
			const resultCount = document.getElementById("resultCount");
			const stateButtons = Array.from(document.querySelectorAll(".state-btn"));

			function updateResults() {
				const query = searchInput.value.trim().toLowerCase();
				let visible = 0;

				stateButtons.forEach((button) => {
					const stateName = button.dataset.state.toLowerCase();
					const matched = stateName.includes(query);
					button.style.display = matched ? "" : "none";
					if (matched) visible += 1;
				});

				resultCount.textContent = `${visible} state${visible === 1 ? "" : "s"} shown`;
			}

			stateButtons.forEach((button) => {
				const stateName = button.dataset.state;

				if (!button.dataset.url) {
					button.classList.add("coming-soon");
					button.dataset.status = "Coming soon";
					button.title = "Page coming soon";
					button.setAttribute("aria-label", `${stateName} - Coming soon`);
					button.disabled = true;
					button.setAttribute("aria-disabled", "true");
					return;
				}

				button.classList.add("available");
				button.dataset.status = "Available";
				button.setAttribute("aria-label", `${stateName} - Available`);

				button.addEventListener("click", () => {
					window.location.href = button.dataset.url;
				});
			});

			searchInput.addEventListener("input", updateResults);
			clearButton.addEventListener("click", () => {
				searchInput.value = "";
				updateResults();
				searchInput.focus();
			});

			updateResults();
		})();
	</script>
</body>
</html>
